name: Release

# Se déclenche sur un tag de version poussé (ex. v0.2), pas sur chaque commit : un tag
# est un acte délibéré ("cette version précise est prête"), contrairement à un push sur
# master. Équivalent à l'ancienne pratique de tag SVN/CVS pour marquer une release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrôle des données personnelles versionnées
        run: python3 tools/check_repository_privacy.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # gradlew est un script shell committé depuis Windows : le bit exécutable n'est
      # pas toujours préservé, ce qui échoue silencieusement en "Permission denied" sur
      # le runner Linux sans ce rappel explicite.
      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      - name: Build APK debug
        run: ./gradlew assembleDebug

      - name: Lint Android
        run: ./gradlew lintDebug

      - name: Régressions audit et propriété CSV hors véhicule
        run: python3 tools/audit_20261007/run.py --include-smoke --timeout 120

      - name: Régressions connexion, captures et voyants
        run: python3 tools/offline_viewmodel/run.py --timeout 240

      - name: Nommer l’APK de la publication
        # app-debug.apk reste un alias identique pour le client de mise à jour 0.17.
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/OBD2-Dash-${GITHUB_REF_NAME}.apk"

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/OBD2-Dash-${{ github.ref_name }}.apk
            app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
